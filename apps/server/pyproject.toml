[project]
name = "jobpilot-server"
version = "1.2.5"
description = "多平台控制台后端：API、编排与静态资源"
requires-python = ">=3.12"
dependencies = [
  "jobpilot-core",
  "jobpilot-platform-base",
  "jobpilot-platform-boss",
  "jobpilot-browser-pool",
  "jobpilot-ai",
  "jobpilot-db",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
jobpilot-core = { workspace = true }
jobpilot-platform-base = { workspace = true }
jobpilot-platform-boss = { workspace = true }
jobpilot-browser-pool = { workspace = true }
jobpilot-ai = { workspace = true }
jobpilot-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_server"]
