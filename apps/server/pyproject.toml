[project]
name = "boss-server"
version = "1.2.5"
description = "多平台控制台后端：API、编排与静态资源"
requires-python = ">=3.12"
dependencies = [
  "boss-core",
  "boss-platform-base",
  "boss-platform-boss",
  "boss-browser-pool",
  "boss-ai",
  "boss-db",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
boss-core = { workspace = true }
boss-platform-base = { workspace = true }
boss-platform-boss = { workspace = true }
boss-browser-pool = { workspace = true }
boss-ai = { workspace = true }
boss-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_server"]
