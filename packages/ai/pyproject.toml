[project]
name = "jobpilot-ai"
version = "1.2.5"
description = "通用 AI 能力（LLM / 简历 / 面试 / 匹配）"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31.0",
  "python-docx>=1.1.0",
  "pypdf>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_ai"]
