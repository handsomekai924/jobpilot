[project]
name = "boss-browser-pool"
version = "1.2.5"
description = "通用 Chrome / CDP 浏览器池"
requires-python = ">=3.12"
dependencies = [
  "boss-core",
  "websocket-client>=1.6.0",
]

[tool.uv.sources]
boss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_browser_pool"]
