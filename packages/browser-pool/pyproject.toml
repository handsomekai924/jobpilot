[project]
name = "jobpilot-browser-pool"
version = "2.0.0"
description = "通用 Chrome / CDP 浏览器池"
requires-python = ">=3.12"
dependencies = [
  "jobpilot-core",
  "websocket-client>=1.6.0",
]

[tool.uv.sources]
jobpilot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_browser_pool"]
