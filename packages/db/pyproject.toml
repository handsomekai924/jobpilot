[project]
name = "jobpilot-db"
version = "2.0.0"
description = "状态库（SQLite）与多站点数据模型"
requires-python = ">=3.12"
dependencies = ["jobpilot-core"]

[tool.uv.sources]
jobpilot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_db"]
