[project]
name = "jobpilot-platform-base"
version = "1.2.5"
description = "站点适配器基座与注册表"
requires-python = ">=3.12"
dependencies = ["jobpilot-core"]

[tool.uv.sources]
jobpilot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_platform_base"]
