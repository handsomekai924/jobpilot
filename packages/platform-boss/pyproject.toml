[project]
name = "boss-platform-boss"
version = "1.2.5"
description = "BOSS 直聘站点适配器"
requires-python = ">=3.12"
dependencies = [
  "boss-core",
  "boss-platform-base",
  "boss-browser-pool",
  "boss-db",
  "requests>=2.31.0",
  "websocket-client>=1.6.0",
  "paho-mqtt>=2.1.0",
  "cryptography>=42.0.0",
  "segno>=1.6.0",
]

[tool.uv.sources]
boss-core = { workspace = true }
boss-platform-base = { workspace = true }
boss-browser-pool = { workspace = true }
boss-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_platform_boss"]
