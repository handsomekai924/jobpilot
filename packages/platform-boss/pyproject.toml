[project]
name = "jobpilot-platform-boss"
version = "2.0.0"
description = "BOSS 直聘站点适配器"
requires-python = ">=3.12"
dependencies = [
  "jobpilot-core",
  "jobpilot-platform-base",
  "jobpilot-browser-pool",
  "jobpilot-db",
  "requests>=2.31.0",
  "websocket-client>=1.6.0",
  "paho-mqtt>=2.1.0",
  "cryptography>=42.0.0",
  "segno>=1.6.0",
]

[tool.uv.sources]
jobpilot-core = { workspace = true }
jobpilot-platform-base = { workspace = true }
jobpilot-browser-pool = { workspace = true }
jobpilot-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot_platform_boss"]
