[tool.uv.workspace]
members = ["apps/server", "packages/*"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.6",
  "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/server/tests", "packages"]
pythonpath = [
  "apps/server/src",
  "packages/core/src",
  "packages/platform-base/src",
  "packages/platform-boss/src",
  "packages/browser-pool/src",
  "packages/ai/src",
  "packages/db/src",
]
